# Status Bar

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g status-style bg=#F2A2D6,fg=#000000
set -g message-style bg=#8EFDF3,fg=#000000
set -g mode-style bg=#8EFDF3,fg=#000000

set -g window-status-style bg=#F2A2D6,fg=#000000
set -g window-status-current-style bg=#F2A2D6,fg=#000000,bold
set -g window-status-format " #W "
set -g window-status-current-format "#[bold] ➤ #W "

set -g status-left ""
set -g status-right "#[fg=#000000,bright]#S"
